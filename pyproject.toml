[project]
name = "crucible"
version = "0.1.0"
description = "Universal knowledge base builder with proactive insight derivation"
requires-python = ">=3.12"
dependencies = [
    "neo4j>=5.0",
    "httpx>=0.27",
    "mcp[cli]>=1.0,<2.0.0",
    "tqdm>=4.0",
    "google-genai>=1.34.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "testcontainers[neo4j]>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires Neo4j via testcontainers (slow)",
]
